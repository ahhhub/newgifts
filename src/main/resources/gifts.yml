# ========================================
# 新手礼包物品配置
# ========================================
# 最多支持 27 个物品（编号 1-27）
# 每个物品支持以下字段：
#   type: 物品材质 (必填)
#   amount: 物品数量 (默认1)
#   name: 物品显示名称 (支持颜色代码)
#   lore: 物品描述 (支持颜色代码，多行)
#   enchantments: 附魔 (格式: 附魔名:等级)
#   flags: 物品标识 (如 HIDE_ENCHANTS)
#   custom-model-data: 自定义模型数据
#   unbreakable: 是否不可破坏
# ========================================

gifts:
  '1':
    type: DIAMOND_SWORD
    amount: 1
    name: '&6新手之剑'
    lore:
      - '&7一把陪伴你起步的宝剑'
    enchantments:
      SHARPNESS: 3
      UNBREAKING: 2
    flags:
      - HIDE_ENCHANTS
    unbreakable: true

  '2':
